name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    env:
      RUSTUP_HOME: ${{ github.workspace }}/.cache/rustup
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --cache ${{ github.workspace }}/.cache/npm

      - name: Fetch sources
        run: npm run sources:fetch

      - name: Build harness
        run: npm run build:harness

      - name: Build plugins
        run: npm run build:plugins

      - name: Package harness
        run: npm run package:harness

      - name: Assemble seed
        run: npm run assemble:seed

      - name: Fetch Node runtime
        run: npm run fetch:node

      - name: Package runtime
        run: npm run package:runtime

      - name: Build shell
        run: npm run shell:build

      - name: Package distribution
        run: npm run package:dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}
          path: |
            out/*.zip
            out/*.dmg
          if-no-files-found: error
