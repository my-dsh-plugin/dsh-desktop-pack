name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    env:
      RUSTUP_HOME: ${{ github.workspace }}/.cache/rustup
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch sources
        run: pnpm run sources:fetch

      - name: Build harness
        shell: bash
        run: set -o pipefail; pnpm run build:harness 2>&1 | tee build-harness.log

      - name: Build plugins
        shell: bash
        run: set -o pipefail; pnpm run build:plugins 2>&1 | tee build-plugins.log

      - name: Package harness
        shell: bash
        run: set -o pipefail; pnpm run package:harness 2>&1 | tee package-harness.log

      - name: Assemble seed
        shell: bash
        run: set -o pipefail; pnpm run assemble:seed 2>&1 | tee assemble-seed.log

      - name: Fetch Node runtime
        shell: bash
        run: set -o pipefail; pnpm run fetch:node 2>&1 | tee fetch-node.log

      - name: Package runtime
        shell: bash
        run: set -o pipefail; pnpm run package:runtime 2>&1 | tee package-runtime.log

      - name: Build shell
        shell: bash
        run: set -o pipefail; pnpm run shell:build 2>&1 | tee build-shell.log

      - name: Package distribution
        shell: bash
        run: set -o pipefail; pnpm run package:dist 2>&1 | tee package-dist.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.platform }}
          path: "*.log"
          if-no-files-found: ignore

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}
          path: |
            out/*.zip
            out/*.dmg
          if-no-files-found: error
